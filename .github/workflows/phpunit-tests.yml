on: push
name: Integration Tests
jobs:
  phpunit-postgres:
    runs-on: ubuntu-latest
    # 8.4 is the supported version; 8.5 is an early warning only
    continue-on-error: ${{ matrix.php != '8.4' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    container:
      image: php:${{ matrix.php }}-cli

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
          TZ: Europe/Warsaw
        ports:
          - 5432:5432

    steps:
      - name: Install PHP extensions and Composer
        run: |
          apt-get update && apt-get install -y --no-install-recommends git unzip
          curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/download/2.12.3/install-php-extensions
          chmod +x /usr/local/bin/install-php-extensions
          install-php-extensions @composer-2.10.3 bcmath gd intl pcntl pdo_mysql pdo_pgsql redis zip

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy environment configuration files
        run: |
          cp docker/envs/.env.ci.postgres .env
          cp docker/envs/phpunit.xml.postgres phpunit.xml

      - name: Update composer
        run: composer update --no-scripts

      - name: Prepare Laravel Application
        run: |
          php artisan key:generate
          php artisan migrate:fresh
          php artisan db:seed --class="Database\Seeders\PermissionsSeeder"
          php artisan passport:keys --force
          php artisan passport:client --personal --no-interaction
          cp storage/oauth-private.key vendor/orchestra/testbench-core/laravel/storage/oauth-private.key
          cp storage/oauth-public.key vendor/orchestra/testbench-core/laravel/storage/oauth-public.key
          mkdir vendor/escolalms/lrs/src/../../storage/
          cp storage/*.key vendor/escolalms/lrs/src/../../storage/

      - name: Special Migrations for Tests
        run: php artisan migrate --path=vendor/escolalms/courses/tests/Database/Migrations

      - name: Run Testsuite
        run: vendor/bin/phpunit
