name: Generate Swagger Documentation

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  swagger-gh-pages:
    runs-on: ubuntu-latest
    container:
      image: php:8.4-cli-alpine

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Instantiate package
        uses: actions/checkout@v4

      - name: Install PHP extensions and Composer
        run: |
          apk add --no-cache bash git unzip
          sh docker/php/install-extensions.sh
          curl --proto '=https' --tlsv1.2 -sSf -o /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
          chmod +x /usr/local/bin/composer

      - name: Prepare Laravel Application
        run: |
          cp docker/envs/.env.ci.mysql .env
          cp docker/envs/phpunit.xml.mysql phpunit.xml

      - name: Install composer dependencies
        run: composer install --no-interaction

      - name: Generage openapi
        run: php artisan l5-swagger:generate

      - name: Generate Swagger UI
        uses: Legion2/swagger-ui-action@v1
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          output: swagger-ui
          spec-file: "./storage/api-docs/api-docs.json"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: swagger-ui
          cname: api-docs.wellms.io
